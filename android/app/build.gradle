plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    
}

// Load keystore properties from key.properties file
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.chamakz.app"
    compileSdk = 36
    
    compileOptions {
        // Enable desugaring for Java 8+ features
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId = "com.chamakz.app"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 36
        versionCode = 31
        versionName = "1.1.9"
        
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }
    
    // ✅ FIX: Ensure native libraries are properly packaged
    // This prevents libflutter.so from being excluded
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/NOTICE', 'META-INF/LICENSE', '/META-INF/{AL2.0,LGPL2.1}']
            pickFirsts += ['lib/**/libc++_shared.so']
            // CRITICAL: Do NOT exclude native libraries
            // Do NOT add: excludes += ['lib/**/libflutter.so']
        }
        jniLibs {
            useLegacyPackaging = false  // Use new packaging system
        }
    }
    
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}
dependencies {

  // Import the Firebase BoM

  implementation platform('com.google.firebase:firebase-bom:34.4.0')


  // TODO: Add the dependencies for Firebase products you want to use

  // When using the BoM, don't specify versions in Firebase dependencies

  implementation 'com.google.firebase:firebase-analytics'
  implementation 'com.google.firebase:firebase-crashlytics'


  // Add the dependencies for any other desired Firebase products

  // https://firebase.google.com/docs/android/setup#available-libraries

  implementation 'androidx.appcompat:appcompat:1.6.1'
  implementation 'androidx.core:core:1.12.0'
  
  // Core library desugaring for Java 8+ features
  coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
  
  // Kotlin standard library
  // Note: kotlin_version is managed in settings.gradle
  implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.1.0"
  
  // Facebook SDK for App Events (Meta App Events SDK)
  // Used for tracking app installs and events for Meta ad campaigns
  implementation 'com.facebook.android:facebook-android-sdk:17.0.0'
}
